<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KLE Timetable Portal · Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0d1b3e;
      --gold: #c9a84c;
      --gold-2: #ead282;
      --ink: #13203c;
      --muted: #68758f;
      --line: rgba(13, 27, 62, 0.12);
      --paper: #ffffff;
      --soft: #f5f1e8;
      --green: #1f7a4d;
      --red: #c24035;
      --blue: #226da8;
      --shadow: 0 18px 45px rgba(13, 27, 62, 0.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: Outfit, system-ui, sans-serif;
      color: var(--ink);
      background: var(--soft);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    button { font: inherit; cursor: pointer; }

    .login-container {
      max-width: 1200px;
      width: 100%;
      background: var(--paper);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .login-hero {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy) 100%);
      color: white;
      padding: 60px 40px;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .login-hero h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: 48px;
      line-height: 1;
      margin: 0 0 16px 0;
      font-weight: 700;
    }

    .login-hero span { color: var(--gold-2); }

    .login-hero p {
      color: rgba(255,255,255,0.7);
      font-size: 16px;
      line-height: 1.6;
      margin: 0;
    }

    .login-form {
      padding: 60px 40px;
      display: grid;
      gap: 24px;
      align-content: center;
    }

    .form-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--navy);
      margin: 0;
    }

    .form-group {
      display: grid;
      gap: 8px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .form-field {
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }

    .form-field:focus {
      outline: 2px solid var(--gold);
      outline-offset: 1px;
    }

    .role-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .role-btn {
      padding: 12px;
      border: 2px solid var(--line);
      background: white;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
      color: var(--navy);
      font-size: 13px;
    }

    .role-btn.active {
      border-color: var(--gold);
      background: var(--gold);
      color: var(--navy);
    }

    .role-btn:hover {
      border-color: var(--gold);
    }

    .error-msg {
      color: var(--red);
      font-size: 13px;
      min-height: 18px;
    }

    .submit-btn {
      padding: 12px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .submit-btn:hover {
      background: #1e5a8e;
      transform: translateY(-2px);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (max-width: 768px) {
      .login-container { grid-template-columns: 1fr; }
      .login-hero { padding: 40px 20px; }
      .login-form { padding: 40px 20px; }
      .login-hero h1 { font-size: 36px; }
      .form-title { font-size: 20px; }
      .role-buttons { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-hero">
      <div>
        <h1>KLE <span>Timetable</span></h1>
        <p>Professional schedule management system for KLE Technological University</p>
      </div>
    </div>

    <div class="login-form">
      <h2 class="form-title">Login</h2>

      <div class="form-group">
        <div class="form-label">Select Role</div>
        <div class="role-buttons">
          <button type="button" class="role-btn active" data-role="admin" onclick="selectRole('admin')">👨‍💼 Admin</button>
          <button type="button" class="role-btn" data-role="faculty" onclick="selectRole('faculty')">👨‍🏫 Faculty</button>
          <button type="button" class="role-btn" data-role="student" onclick="selectRole('student')">👨‍🎓 Student</button>
        </div>
      </div>

      <div class="form-group">
        <div class="form-label">Password</div>
        <input type="password" id="password" class="form-field" placeholder="Enter password" onkeypress="handleKeyPress(event)">
      </div>

      <div class="error-msg" id="error"></div>

      <button type="button" class="submit-btn" id="submitBtn" onclick="handleLogin()">Sign In</button>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    let selectedRole = 'admin';

    function selectRole(role) {
      selectedRole = role;
      document.querySelectorAll('.role-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.role === role);
      });
      document.getElementById('password').focus();
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') handleLogin();
    }

    async function handleLogin() {
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      const submitBtn = document.getElementById('submitBtn');

      if (!password) {
        errorEl.textContent = 'Please enter password';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      const result = await login(selectedRole, password);

      if (result) {
        const portals = { admin: 'admin.html', faculty: 'faculty.html', student: 'student.html' };
        window.location.href = portals[selectedRole];
      } else {
        errorEl.textContent = 'Invalid password. Please try again.';
        document.getElementById('password').select();
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
